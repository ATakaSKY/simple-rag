services:
  postgres:
    image: pgvector/pgvector:pg17
    container_name: simple-rag-postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: rag
    ports:
      - "5433:5432"
    volumes:
      - rag-postgres-data:/var/lib/postgresql/data

volumes:
  rag-postgres-data:
